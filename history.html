<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout History - Liaqaty</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Workout History</h1>
    <p class="text">
      Total workouts: <span th:text="${total}">0</span>
    </p>

    <table class="workout-Logs">
      <thead>
        <tr><th>Date</th><th>Workout</th><th>Minutes</th></tr>
      </thead>
      <tbody>
        <tr th:each="log : ${logs}">
          <td th:text="${log.date()}">date</td>
          <td th:text="${log.workoutName()}">name</td>
          <td th:text="${log.minutes()}">0</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
