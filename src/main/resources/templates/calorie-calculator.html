
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Calculator - Liaqati</title>
    <script src="/js/calorie-calculator.js" defer></script>
</head>
<body>

    <h1>Calorie Calculator</h1>

    <form id="calorieForm">

        <label for="age">Age:</label>
        <input type="number" id="age" required min="1">

        <label for="gender">Gender:</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" required min="1">

        <label for="height">Height (cm):</label>
        <input type="number" id="height" required min="1">

        <label for="activity">Activity Level:</label>
        <select id="activity" required>
            <option value="">Select Activity Level</option>
            <option value="1.2">Sedentary</option>
            <option value="1.375">Light Activity</option>
            <option value="1.55">Moderate Activity</option>
            <option value="1.725">Very Active</option>
        </select>

        <button type="submit">Calculate</button>
        <button type="reset">Reset</button>

    </form>

    <div id="calorieResult"></div>

</body>
</html>
