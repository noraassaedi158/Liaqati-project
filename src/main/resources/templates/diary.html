<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout History - Liaqaty</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
	<form method="post" th:action="@{/diary}">
	  <div class="mb-3">
	    <label for="workout" class="form-label">Workout</label>
	    <select id="workout" name="workout" class="form-select" required>
	      <option value="">Choose a workout...</option>
	      <option th:each="w : ${workouts}" th:value="${w.workoutId}" th:text="${w.workoutName}">Workout</option>
	    </select>
	  </div>
	  <div class="mb-3">
	    <label for="date" class="form-label">Date</label>
	    <input type="date" id="date" name="date" th:value="${today}" class="form-control" required>
	  </div>

	  <div class="mb-3">
	    <label for="time" class="form-label">Time</label>
	    <input type="time" name="time" id="time" th:value="${currentTime}" class="form-control" required>
	  </div>

	  <div class="mb-3">
	    <label for="minutes" class="form-label">Duration (minutes)</label>
	    <select id="minutes" name="minutes"  class="form-select" required>
	      <option value="">How long?</option>
	      <option th:each="m : ${#numbers.sequence(5, 120, 5)}"
	              th:value="${m}" th:text="${m} + ' min'">30 min</option>
	    </select>
	  </div>

	  <button type="submit" class="btn btn-success"
	          title="Saves this workout to your history">
	    Mark as Completed
	  </button>
	</form>
</body>
</html>
