
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liaqati - Fitness Tools</title>
</head>

<body>

    <header>
        <h1>Liaqati</h1>
    </header>

    <main>

        <h2>Fitness Tools</h2>

        <!-- Calorie Calculator -->
        <section>
            <h3>Calorie Calculator</h3>

            <form>
                <label for="age">Age:</label>
                <input type="number" id="age" placeholder="Enter your age">

                <label for="gender">Gender:</label>
                <select id="gender">
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>

                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" placeholder="Enter weight">

                <label for="height">Height (cm):</label>
                <input type="number" id="height" placeholder="Enter height">

                <label for="activity">Activity Level:</label>
                <select id="activity">
                    <option value="">Select Activity Level</option>
                    <option value="1.2">Sedentary</option>
                    <option value="1.375">Light Activity</option>
                    <option value="1.55">Moderate Activity</option>
                    <option value="1.725">Very Active</option>
                </select>

                <button type="button">Calculate</button>
                <button type="reset">Reset</button>

                <div id="calorieResult">
                    Your result will appear here.
                </div>
            </form>
        </section>

        <!-- Water Reminder -->
        <section>
            <h3>Water Reminder</h3>

            <p>Set a timer to remind you to drink water.</p>

            <label for="waterMinutes">Reminder Interval (minutes):</label>
            <input type="number" id="waterMinutes" placeholder="Enter minutes">

            <div id="waterDisplay">00:00</div>

            <button type="button">Start</button>
            <button type="button">Pause</button>
            <button type="button">Reset</button>
        </section>

        <!-- Rest Timer -->
        <section>
            <h3>Rest Timer</h3>

            <p>Set a timer for your rest breaks.</p>

            <label for="restMinutes">Rest Duration (minutes):</label>
            <input type="number" id="restMinutes" placeholder="Enter minutes">

            <div id="restDisplay">00:00</div>

            <button type="button">Start</button>
            <button type="button">Pause</button>
            <button type="button">Reset</button>
        </section>

    </main>

    <footer>
        <p>Liaqati - Your Fitness Journey</p>
    </footer>

</body>
</html>
