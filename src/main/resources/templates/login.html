<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Liaqaty</title>
</head>
<body>
    <h2>Welcome Back</h2>

    <div th:if="${param.error}" style="color: #d8000c; background-color: #ffbaba; border: 1px solid #d8000c; padding: 10px; margin-bottom: 15px; border-radius: 5px; font-weight: bold;">
        Invalid Email or Password!
    </div>

    <div th:if="${param.logout}" style="color: green; font-weight: bold; margin-bottom: 15px;">
        You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>

        <button type="submit">Log In</button>
    </form>
</body>
</html>
