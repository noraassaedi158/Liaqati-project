
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest Timer - Liaqati</title>
    <script src="/js/rest-timer.js" defer></script>
</head>
<body>

    <h1>Rest Timer</h1>

    <p>Set a timer for your rest breaks.</p>

    <label for="restMinutes">Rest Duration (minutes):</label>
    <input type="number" id="restMinutes" min="1" required>

    <h2 id="restDisplay">00:00</h2>

    <button id="restStart">Start</button>
    <button id="restPause">Pause</button>
    <button id="restReset">Reset</button>

</body>
</html>
