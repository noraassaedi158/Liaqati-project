
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Reminder - Liaqati</title>
    <script src="/js/water-reminder.js" defer></script>
</head>
<body>

    <h1>Water Reminder</h1>

    <p>Set a reminder to drink water.</p>

    <label for="waterMinutes">Reminder Interval (minutes):</label>
    <input type="number" id="waterMinutes" min="1" required>

    <h2 id="waterDisplay">00:00</h2>

    <button id="waterStart">Start</button>
    <button id="waterPause">Pause</button>
    <button id="waterReset">Reset</button>

</body>
</html>
